# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-elkpi"
BBFILE_PATTERN_meta-elkpi = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-elkpi = "10"
LAYERSERIES_COMPAT_meta-elkpi = "kirkstone scarthgap"
BBMASK += "meta-elk/recipes-devtools/clang/clang_git.bbappend"

# JUCE-based plugins (e.g. ob-xf) unconditionally include X11 headers at
# compile time regardless of DISTRO_FEATURES. elk.conf removes x11 via:
#   DISTRO_FEATURES:remove = "${@bb.utils.contains('INSTALL_X11_SUPPORT','1','wayland','wayland x11',d)}"
# Setting INSTALL_X11_SUPPORT=1 restricts that remove to 'wayland' only, and
# the append below re-adds x11 so libx11 etc. are buildable as recipe sysroot
# dependencies. PACKAGE_EXCLUDE is a hard guard — X11 runtime libs are never
# installed into the target rootfs.
INSTALL_X11_SUPPORT = "1"
DISTRO_FEATURES:append = " x11"
PACKAGE_EXCLUDE += "libx11 libx11-locale libxext libxinerama libxrandr libxcursor libxau libxdmcp libxcb"
